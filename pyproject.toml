[project]
name = "ai-potluck"
version = "0.1.0"
description = "AI potluck client and protocol core: verifiable metering and multi-party settlement for shared compute"
readme = "README.md"
license = "MIT"
authors = [
    { name = "The ai-potluck authors" },
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
potluck = "aipotluck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipotluck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/aipotluck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
