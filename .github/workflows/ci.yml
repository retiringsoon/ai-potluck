# CI for the ai-potluck package: ruff, mypy --strict, and the pytest suite on
# the two Python versions the project supports (>=3.11).
#
# The suite covers the protocol/domain core and the client CLIs without a
# center; the integration tests that spin up a real center live in the
# ai-potluck-server repository and run there.
#
# pytest's system temp directory is writable on a normal CI runner, so no
# --basetemp override is needed here (the sandboxed local runs are the ones
# that require it).

name: ci

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: ruff
        run: .venv/bin/ruff check src/ tests/

      - name: mypy
        run: .venv/bin/mypy

      - name: pytest
        run: .venv/bin/python -m pytest tests/ -q
